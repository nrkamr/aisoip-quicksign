name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AISOIPQuickSign aisoip_quicksign.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AISOIPQuickSign-Windows
          path: dist/AISOIPQuickSign.exe
